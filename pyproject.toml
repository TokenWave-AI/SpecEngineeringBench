[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "specengineeringbench"
version = "0.1.0"
description = "Download and score SpecEngineeringBench verifier results"
requires-python = ">=3.10"
dependencies = ["huggingface-hub>=0.32,<2"]

[project.scripts]
specbench = "eval.specbench:main"

[tool.setuptools]
packages = ["eval"]

[tool.ruff]
line-length = 120
